<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindMap — Dashboard</title>
  <link rel="stylesheet" href="theme.css" />
  <script src="vendor/chart.umd.js"></script>
  <style>
    body { min-height: 100vh; }

    #app {
      position: relative;
      z-index: 2;
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 40px;
    }
    .wordmark {
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }
    .wordmark:hover { color: #fff; }

    /* ── Grid ────────────────────────────────────────── */
    .row { display: grid; gap: 20px; margin-bottom: 20px; }
    .row-hero  { grid-template-columns: 5fr 7fr; }
    .row-split { grid-template-columns: 7fr 5fr; }
    @media (max-width: 900px) {
      .row-hero, .row-split { grid-template-columns: 1fr; }
      #app { padding: 28px 16px 60px; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--edge);
      border-radius: var(--radius);
      padding: 28px;
      min-width: 0;
    }
    .card > .label { margin-bottom: 22px; display: block; }

    /* ── Cover (brain score) ─────────────────────────── */
    #cover {
      aspect-ratio: 1 / 1;
      max-height: 520px;
      width: 100%;
      padding: 36px 36px 30px;
      display: flex;
      flex-direction: column;
    }
    .cover-title {
      font-size: 17px;
      line-height: 2.1;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
    }
    .cover-score {
      margin-top: auto;
      font-size: clamp(64px, 9vw, 112px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .cover-score small { font-size: 0.4em; letter-spacing: 0; opacity: 0.8; }
    .cover-state {
      margin-top: 18px;
      font-size: 15px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }
    .cover-foot {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
    }
    .cover-foot u { text-decoration-thickness: 1px; text-underline-offset: 4px; }

    /* ── Today ───────────────────────────────────────── */
    .kpi {
      font-size: 56px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .kpi-sub { margin-top: 10px; color: var(--ink-3); font-size: 12px; letter-spacing: 0.08em; }

    .stack {                                   /* part-to-whole bar */
      display: flex;
      gap: 2px;                                /* surface gap between segments */
      height: 14px;
      margin: 30px 0 26px;
    }
    .stack > div { min-width: 3px; }
    .stack > div:first-child { border-radius: 4px 0 0 4px; }
    .stack > div:last-child  { border-radius: 0 4px 4px 0; }
    .stack > div:only-child  { border-radius: 4px; }

    .rows { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rows td { padding: 11px 0; border-top: 1px solid var(--hairline); }
    .rows td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
    .rows td.pct { width: 64px; }
    .key {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 14px;
    }
    .footnote { margin-top: 18px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); line-height: 1.8; }

    /* ── Charts ──────────────────────────────────────── */
    .chart { position: relative; height: 280px; }
    .chart.short { height: 240px; }

    /* ── Heatmap ─────────────────────────────────────── */
    .heatmap {
      display: grid;
      grid-template-columns: 54px repeat(24, minmax(0, 1fr));
      gap: 2px;
      align-items: center;
    }
    .hm-h { font-size: 9px; color: var(--ink-3); text-align: center; letter-spacing: 0.08em; height: 18px; }
    .hm-d { font-size: 10px; color: var(--ink-3); letter-spacing: 0.16em; text-transform: uppercase; }
    .hm-c { height: 24px; border-radius: 3px; background: rgba(255, 255, 255, 0.035); }
    .hm-c[data-tip]:hover { outline: 1px solid rgba(255, 255, 255, 0.6); }
    .scale { display: flex; align-items: center; gap: 4px; margin-top: 18px; justify-content: flex-end; }
    .scale span { font-size: 10px; letter-spacing: 0.2em; color: var(--ink-3); text-transform: uppercase; margin: 0 8px; }
    .scale i { width: 18px; height: 10px; border-radius: 2px; display: block; }

    /* ── Streak ──────────────────────────────────────── */
    .streak-nums { display: flex; gap: 48px; margin-bottom: 26px; }
    .streak-nums .kpi { font-size: 48px; }
    .streak-nums .label { margin-top: 10px; display: block; }
    .dots { display: grid; grid-template-columns: repeat(15, 1fr); gap: 6px; }
    .dots i { aspect-ratio: 1; border-radius: 3px; background: rgba(255, 255, 255, 0.06); display: block; }
    .dots i.on { background: #199e70; }
    .dots i.today { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5); }
    .legend { display: flex; gap: 22px; margin-top: 18px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }

    /* ── Top sites ───────────────────────────────────── */
    .sites { width: 100%; border-collapse: collapse; font-size: 13px; }
    .sites th { text-align: left; font-weight: 400; padding: 0 0 12px; }
    .sites td { padding: 12px 0; border-top: 1px solid var(--hairline); vertical-align: middle; }
    .sites .rank { width: 44px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .sites .time { text-align: right; padding-right: 20px; color: var(--ink-2); font-variant-numeric: tabular-nums; width: 90px; }
    .sites .bar { width: 28%; }
    .track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.06); }
    .fill { height: 4px; border-radius: 2px; }

    .picker {
      appearance: none;
      border: 1px solid var(--edge);
      border-radius: 99px;
      padding: 5px 14px 5px 26px;
      font: inherit;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-2);
      cursor: pointer;
      background-repeat: no-repeat;
    }
    .picker:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.25); }
    .picker option { background: #121a2e; color: var(--ink); }
    .edited { margin-left: 8px; color: var(--ink-3); font-size: 11px; }

    /* ── Categories ──────────────────────────────────── */
    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    @media (max-width: 900px) { .cat-grid { grid-template-columns: 1fr; gap: 28px; } }
    .cat-list { list-style: none; font-size: 13px; }
    .cat-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hairline); }
    .cat-list .key { margin-right: 0; flex: none; }
    .cat-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .cat-kind { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
    .cat-list .none { color: var(--ink-3); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
    .x {
      background: none; border: 1px solid var(--edge); border-radius: 50%;
      width: 24px; height: 24px; color: var(--ink-3); cursor: pointer; font: inherit; line-height: 1;
    }
    .x:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.3); }
    form.inline { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
    #assign { margin-top: 0; }
    form.inline input:not([type=checkbox]) {
      flex: 1; min-width: 160px; height: 34px; padding: 0 14px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--edge); border-radius: 99px;
      color: var(--ink); font: inherit; font-size: 12px; outline: none;
    }
    form.inline input:focus { border-color: rgba(255, 255, 255, 0.35); }
    form.inline button {
      height: 34px; padding: 0 18px; border-radius: 99px; cursor: pointer;
      background: rgba(255, 255, 255, 0.1); border: 1px solid var(--edge); color: var(--ink);
      font: inherit; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    }
    form.inline button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
    form.inline :disabled { opacity: 0.4; cursor: not-allowed; }
    .check { font-size: 11px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
    .picker.plain { padding-left: 14px; background: rgba(255, 255, 255, 0.04); }
    .hint { margin: 12px 0 8px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }

    .empty { color: var(--ink-3); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; padding: 40px 0; text-align: center; }

    #loading { position: relative; z-index: 2; text-align: center; padding-top: 30vh; }
  </style>
</head>
<body>
  <div class="aura"></div>
  <div class="grain"></div>

  <div id="loading" class="label">Reading your week…</div>

  <div id="app" hidden>
    <header>
      <a class="wordmark" href="newtab.html">MindMap</a>
      <span class="label" id="updated"></span>
    </header>

    <div class="row row-hero">
      <section id="cover" class="cover" aria-label="Brain health, last 7 days"></section>
      <section class="card" id="today"></section>
    </div>

    <section class="card row" id="week"></section>

    <div class="row row-split">
      <section class="card" id="trend"></section>
      <section class="card" id="streak"></section>
    </div>

    <section class="card row" id="heatmap"></section>

    <section class="card row" id="sites"></section>

    <section class="card row" id="categories"></section>
  </div>

  <script src="sites.js"></script>
  <script src="shared.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
