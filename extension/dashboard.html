<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindMap — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="vendor/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #05050d;
      --card-bg:      rgba(255, 255, 255, 0.035);
      --card-border:  rgba(255, 255, 255, 0.07);
      --card-shadow:  0 4px 32px rgba(0, 0, 0, 0.4);
      --text:         #f0f0fa;
      --text-muted:   #4a4a66;
      --text-dim:     #1e1e2e;

      --learning:      #1D9E75;
      --entertainment: #D85A30;
      --social:        #C44BE0;
      --productivity:  #378ADD;
      --news:          #EF9F27;
      --other:         #7a7a8a;

      --radius: 18px;
      --gap:    20px;
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(15, 15, 50, 0.9) 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(29, 158, 117, 0.04) 0%, transparent 60%);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 40px 28px 80px;
    }

    #app { max-width: 1200px; margin: 0 auto; }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 52px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(240, 240, 250, 0.75);
      text-decoration: none;
      transition: opacity 0.18s ease;
    }

    .logo:hover { opacity: 0.75; }

    .logo-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--learning);
      box-shadow: 0 0 10px var(--learning);
      animation: pulse-dot 3s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    .header-right { text-align: right; }

    .subtitle {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
    }

    #last-updated {
      font-size: 10px;
      color: rgba(74, 74, 102, 0.6);
      margin-top: 4px;
    }

    /* ── Grid layouts ───────────────────────────────────── */
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }

    @media (max-width: 960px) {
      .grid-3 { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .grid-2 { grid-template-columns: 1fr; }
      body { padding: 24px 16px 60px; }
      header { margin-bottom: 36px; }
    }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: var(--gap);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--card-shadow);
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.11);
    }

    .card h2 {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    /* ── Loading ────────────────────────────────────────── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 400;
      gap: 14px;
      letter-spacing: 0.04em;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 1.5px solid rgba(255,255,255,0.08);
      border-top-color: var(--learning);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Gauge ──────────────────────────────────────────── */
    #gauge-card { display: flex; flex-direction: column; }

    .gauge-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 6px;
    }

    .gauge-state {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .gauge-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
      font-weight: 400;
    }

    /* ── Nutrition Label ────────────────────────────────── */
    .nl-wrap {
      font-family: 'Inter', sans-serif;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 14px 16px;
      max-width: 300px;
      margin: 0 auto;
      background: rgba(255,255,255,0.02);
    }

    .nl-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }

    .nl-serving {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      padding: 4px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 5px solid rgba(255,255,255,0.12);
      margin: 6px 0 5px;
      color: var(--text-muted);
    }

    .nl-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 3px solid rgba(255,255,255,0.12);
      padding-bottom: 4px;
      margin-bottom: 4px;
    }

    .nl-total-label { font-size: 15px; font-weight: 700; }
    .nl-total-value { font-size: 15px; font-weight: 700; }

    .nl-dv-header {
      font-size: 9px;
      text-align: right;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 3px;
      margin-bottom: 3px;
    }

    .nl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 12px;
    }

    .nl-row:last-of-type { border-bottom: none; }

    .nl-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .nl-cat-name { display: flex; align-items: center; flex: 1; }

    .nl-time { color: var(--text-muted); font-size: 10px; margin-right: 8px; }

    .nl-pct { font-weight: 600; min-width: 30px; text-align: right; font-size: 11px; }

    .nl-footnote {
      font-size: 9px;
      color: rgba(74, 74, 102, 0.7);
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 6px;
      padding-top: 5px;
      line-height: 1.5;
    }

    /* ── Chart containers ───────────────────────────────── */
    .chart-donut  { position: relative; height: 200px; }
    .chart-bar    { position: relative; height: 240px; }
    .chart-line   { position: relative; height: 210px; }

    /* ── Heatmap ────────────────────────────────────────── */
    .heatmap-grid {
      display: grid;
      grid-template-columns: 42px repeat(24, 1fr);
      gap: 2px;
      font-size: 9px;
      overflow-x: auto;
    }

    .hm-hour-label {
      text-align: center;
      color: var(--text-muted);
      padding-bottom: 3px;
      min-width: 0;
    }

    .hm-day-label {
      color: var(--text-muted);
      align-self: center;
      text-align: right;
      padding-right: 6px;
      white-space: nowrap;
    }

    .hm-cell {
      height: 18px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
      min-width: 0;
      cursor: default;
      transition: transform 0.12s, opacity 0.12s;
    }

    .hm-cell:hover { transform: scale(1.4); z-index: 1; opacity: 0.9; }

    .heatmap-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .heatmap-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .heatmap-legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
    }

    /* ── Top sites ──────────────────────────────────────── */
    .sites-table {
      width: 100%;
      border-collapse: collapse;
    }

    .sites-table th {
      text-align: left;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .sites-table td {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }

    .sites-table tr:last-child td { border-bottom: none; }

    .site-domain { font-weight: 500; font-size: 13px; }

    .cat-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .cat-select {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-align: center;
    }
    .cat-select:hover { filter: brightness(1.3); }
    .cat-select option { background: #14141c; color: #eee; font-size: 12px; }
    .cat-edited { margin-left: 6px; font-size: 11px; color: var(--text-muted); }

    .site-time {
      text-align: right;
      color: var(--text-muted);
      font-size: 12px;
      padding-right: 12px;
      white-space: nowrap;
    }

    .bar-cell { width: 80px; }

    .site-bar-track {
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .site-bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    /* ── Streak ─────────────────────────────────────────── */
    .streak-stats {
      display: flex;
      gap: 32px;
      margin-bottom: 22px;
    }

    .streak-stat-val {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -2.5px;
      line-height: 1;
    }

    .streak-stat-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .streak-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .streak-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      cursor: default;
      transition: transform 0.12s, opacity 0.12s;
    }

    .streak-dot:hover { transform: scale(1.5); opacity: 0.85; }
    .streak-dot.on    { background: var(--learning); }
    .streak-dot.off   { background: rgba(255,255,255,0.05); }

    .streak-legend {
      display: flex;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .streak-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* ── No data placeholder ────────────────────────────── */
    .no-data {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 400;
      gap: 10px;
      letter-spacing: 0.02em;
    }

    .no-data-icon { font-size: 22px; opacity: 0.5; }
  </style>
</head>
<body>

<a class="logo" href="newtab.html">
  <div class="logo-dot"></div>
  MindMap
</a>

<div id="app">

  <header>
    <div class="header-right">
      <div class="subtitle">Brain Nutrition Dashboard</div>
      <div id="last-updated"></div>
    </div>
  </header>

  <div id="loading">
    <div class="spinner"></div>
    Fetching your brain data…
  </div>

  <div id="content" style="display:none">

    <!-- Row 1: Gauge · Nutrition Label · Donut -->
    <div class="grid-3">
      <div class="card" id="gauge-card"><h2>Brain Health Score — 7 Days</h2></div>
      <div class="card" id="nutrition-card"><h2>Today's Nutrition Label</h2></div>
      <div class="card" id="donut-card"><h2>Today's Diet Breakdown</h2></div>
    </div>

    <!-- Row 2: Weekly stacked bar -->
    <div class="card" id="weekly-card"><h2>Last 7 Days — Time by Category</h2></div>

    <!-- Row 3: 30-day trend line -->
    <div class="card" id="trend-card"><h2>30-Day Learning Trend</h2></div>

    <!-- Row 4: Heatmap -->
    <div class="card" id="heatmap-card"><h2>Time-of-Day Heatmap — Last 7 Days</h2></div>

    <!-- Row 5: Top sites + Streak -->
    <div class="grid-2">
      <div class="card" id="sites-card"><h2>Top Sites This Week</h2></div>
      <div class="card" id="streak-card"><h2>Learning Streak — Last 30 Days</h2></div>
    </div>

  </div>
</div>

<script src="shared.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
