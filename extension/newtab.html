<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { height: 100vh; overflow: hidden; }

    /* ── Background: one momiji scene ─────────────────
       backgrounds/momiji-<scene>.webp, 1920×1200, 15–30 KB each, bundled.
       newtab.js sets body[data-bg] before first paint, by time of day or the
       user's pick. Static: no network, no animation, no CSS filter. */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url(backgrounds/momiji-healthy.webp) center / cover no-repeat;
    }
    body[data-bg="thriving"] #bg { background-image: url(backgrounds/momiji-thriving.webp); }
    body[data-bg="sluggish"] #bg { background-image: url(backgrounds/momiji-sluggish.webp); }
    body[data-bg="rotting"]  #bg { background-image: url(backgrounds/momiji-rotting.webp); }
    .shade {                       /* keeps the bottom tile readable */
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(7, 11, 20, 0.15) 0%, rgba(7, 11, 20, 0.35) 55%, rgba(7, 11, 20, 0.85) 100%);
    }
    .grain { z-index: 2; }

    #content {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 36px 44px;
    }

    /* ── Clock + greeting ───────────────────────────── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      text-align: center;
    }
    #clock {
      display: flex;
      align-items: flex-start;
      gap: 0.12em;
      font-size: clamp(4.5rem, 12vw, 8.5rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    #ampm {
      font-size: 0.16em;
      letter-spacing: var(--tracking);
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.4em;
    }
    #greeting {
      font-size: 13px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      cursor: text;
      min-height: 1.6em;
    }
    .name-input {
      width: 18ch;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      padding-bottom: 4px;
    }
    .name-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    /* ── Search ─────────────────────────────────────── */
    #search { width: min(560px, 82vw); margin-top: 14px; }
    #q {
      width: 100%;
      height: 50px;
      padding: 0 26px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(10, 14, 24, 0.28);
      color: #fff;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.06em;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    #q::placeholder {
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      font-size: 11px;
    }
    #q:hover { border-color: rgba(255, 255, 255, 0.28); }
    #q:focus { border-color: rgba(255, 255, 255, 0.55); background: rgba(10, 14, 24, 0.4); }
    #q::-webkit-search-cancel-button { filter: invert(1); opacity: 0.5; }

    /* ── Bottom row ─────────────────────────────────── */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    /* Brain score as a small album-cover tile */
    #brain-widget {
      display: flex;
      flex-direction: column;
      width: 228px;
      aspect-ratio: 1 / 1;
      padding: 22px 22px 20px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.25s ease;
    }
    #brain-widget.loaded { opacity: 1; }
    #brain-widget:hover { transform: translateY(-3px); }
    .tile-title {
      font-size: 11px;
      line-height: 2;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }
    #score-num {
      margin-top: auto;
      font-size: 64px;
      font-weight: 300;
      line-height: 1;
    }
    #score-num small { font-size: 0.4em; opacity: 0.8; }
    #state-name {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }
    .tile-foot {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    /* Tile with the background controls underneath */
    .tile-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 228px;
    }
    .bg-controls { display: flex; gap: 8px; }
    .bg-controls button {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(10, 14, 24, 0.28);
      color: rgba(255, 255, 255, 0.88);
      font: inherit;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .bg-controls button:hover { border-color: rgba(255, 255, 255, 0.32); background: rgba(10, 14, 24, 0.4); }
    .bg-controls button:focus-visible { outline: none; border-color: rgba(255, 255, 255, 0.6); }

    /* Scene: shows the current scene, click for the next one (turns Auto off) */
    #bg-picker { flex: 1; min-width: 0; justify-content: space-between; }
    #bg-picker .bg-k { font-size: 14px; letter-spacing: 0; color: rgba(255, 255, 255, 0.55); }
    #bg-auto { flex: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Auto: on/off switch — on, the scene follows the time of day */
    .switch {
      position: relative;
      width: 24px;
      height: 14px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: background 0.2s ease;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    #bg-auto[aria-checked="true"] .switch { background: rgba(255, 255, 255, 0.85); border-color: transparent; }
    #bg-auto[aria-checked="true"] .switch::after { transform: translateX(10px); background: #0b1020; }

  </style>
</head>
<body>
  <div class="aura"></div>
  <div id="bg"></div>
  <div class="shade"></div>
  <div class="grain"></div>

  <div id="content">
    <div class="center">
      <div id="clock" class="ghost"><span id="time-digits">--:--</span><span id="ampm"></span></div>
      <div id="greeting"></div>
      <form id="search" role="search">
        <input id="q" type="search" name="q" placeholder="Search the web" autocomplete="off" aria-label="Search the web" />
      </form>
    </div>

    <div class="bottom">
      <div class="tile-stack">
      <a id="brain-widget" class="cover" title="Open dashboard">
        <div class="grain-layer"></div>
        <div class="tile-title">Brain health<br>last 7 days</div>
        <div id="score-num">--</div>
        <div id="state-name">Loading</div>
        <div class="tile-foot" id="state-sub"></div>
      </a>

        <div class="bg-controls">
          <button id="bg-picker" type="button" title="Next background">
            <span><span class="sr-only">Scene: </span><span id="bg-name"></span></span><span class="bg-k" aria-hidden="true">›</span>
          </button>
          <button id="bg-auto" type="button" role="switch" aria-checked="true" title="Change the scene with the time of day">
            <span>Auto</span><span class="switch" aria-hidden="true"></span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="sites.js"></script>
  <script src="shared.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
