<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { height: 100vh; overflow: hidden; }

    /* ── Wallpaper ───────────────────────────────────
       Each wallpaper is a 44×54px, pre-blurred colour field (~2 KB, bundled
       in wallpapers/). The CSS blur smooths it when stretched to full screen.
       Set by newtab.js from the saved choice; fades in once. Static: no
       network, no animation. */
    #bg {
      position: fixed;
      inset: -8%;
      z-index: 0;
      background: center / cover no-repeat;
      filter: blur(20px) saturate(1.3);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #bg.ready { opacity: 0.9; }

    /* ── Wallpaper picker ────────────────────────────── */
    .wp { position: relative; }
    #wp-btn {
      width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
      background: rgba(10, 14, 24, 0.3); border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.75); display: grid; place-items: center;
    }
    #wp-btn:hover, #wp-btn[aria-expanded="true"] { color: #fff; border-color: rgba(255, 255, 255, 0.45); }
    #wp-panel {
      position: absolute; right: 0; bottom: 52px; width: 288px; padding: 18px;
      border-radius: 20px; background: rgba(10, 14, 24, 0.82); border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    #wp-panel[hidden] { display: none; }
    .wp-title { font-size: 10px; letter-spacing: var(--tracking); text-transform: uppercase; color: rgba(255, 255, 255, 0.55); margin-bottom: 14px; }
    .wp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
    .wp-note { margin-top: 14px; font-size: 9px; letter-spacing: 0.14em; line-height: 1.7; text-transform: uppercase; color: rgba(255, 255, 255, 0.45); }
    .wp-opt { background: none; border: none; cursor: pointer; color: rgba(255, 255, 255, 0.7); font: inherit; padding: 0; }
    .wp-swatch {
      display: block; aspect-ratio: 4 / 3; border-radius: 10px; margin-bottom: 7px;
      background: center / cover no-repeat; filter: blur(0.5px) saturate(1.3);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .wp-brain { background-image: linear-gradient(90deg, #6ad6ea, #7fb0e6 35%, #988877 68%, #5e6572); }
    .wp-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; }
    .wp-opt:hover { color: #fff; }
    .wp-opt[aria-checked="true"] { color: #fff; }
    .wp-opt[aria-checked="true"] .wp-swatch { box-shadow: 0 0 0 2px #fff; }
    .shade {                       /* keeps the bottom tile readable */
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(7, 11, 20, 0.15) 0%, rgba(7, 11, 20, 0.35) 55%, rgba(7, 11, 20, 0.85) 100%);
    }
    .grain { z-index: 2; }

    #content {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 36px 44px;
    }

    /* ── Clock + greeting ───────────────────────────── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      text-align: center;
    }
    #clock {
      display: flex;
      align-items: flex-start;
      gap: 0.12em;
      font-size: clamp(4.5rem, 12vw, 8.5rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    #ampm {
      font-size: 0.16em;
      letter-spacing: var(--tracking);
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.4em;
    }
    #greeting {
      font-size: 13px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      cursor: text;
      min-height: 1.6em;
    }
    .name-input {
      width: 18ch;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      padding-bottom: 4px;
    }
    .name-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    /* ── Search ─────────────────────────────────────── */
    #search { width: min(560px, 82vw); margin-top: 14px; }
    #q {
      width: 100%;
      height: 50px;
      padding: 0 26px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(10, 14, 24, 0.28);
      color: #fff;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.06em;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    #q::placeholder {
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      font-size: 11px;
    }
    #q:hover { border-color: rgba(255, 255, 255, 0.28); }
    #q:focus { border-color: rgba(255, 255, 255, 0.55); background: rgba(10, 14, 24, 0.4); }
    #q::-webkit-search-cancel-button { filter: invert(1); opacity: 0.5; }

    /* ── Bottom row ─────────────────────────────────── */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    /* Brain score as a small album-cover tile */
    #brain-widget {
      display: flex;
      flex-direction: column;
      width: 228px;
      aspect-ratio: 1 / 1;
      padding: 22px 22px 20px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.25s ease;
    }
    #brain-widget.loaded { opacity: 1; }
    #brain-widget:hover { transform: translateY(-3px); }
    .tile-title {
      font-size: 11px;
      line-height: 2;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }
    #score-num {
      margin-top: auto;
      font-size: 64px;
      font-weight: 300;
      line-height: 1;
    }
    #score-num small { font-size: 0.4em; opacity: 0.8; }
    #state-name {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }
    .tile-foot {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

  </style>
</head>
<body>
  <div class="aura"></div>
  <div id="bg"></div>
  <div class="shade"></div>
  <div class="grain"></div>

  <div id="content">
    <div class="center">
      <div id="clock" class="ghost"><span id="time-digits">--:--</span><span id="ampm"></span></div>
      <div id="greeting"></div>
      <form id="search" role="search">
        <input id="q" type="search" name="q" placeholder="Search the web" autocomplete="off" aria-label="Search the web" />
      </form>
    </div>

    <div class="bottom">
      <a id="brain-widget" class="cover" title="Open dashboard">
        <div class="grain-layer"></div>
        <div class="tile-title">Brain health<br>last 7 days</div>
        <div id="score-num">--</div>
        <div id="state-name">Loading</div>
        <div class="tile-foot" id="state-sub"></div>
      </a>

      <div class="wp">
        <button id="wp-btn" title="Change wallpaper" aria-label="Change wallpaper" aria-expanded="false" aria-controls="wp-panel">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" />
            <path d="M1.5 11l4-4 3 3 2-2 4 4" />
            <circle cx="11" cy="5.5" r="1.2" />
          </svg>
        </button>
        <div id="wp-panel" role="radiogroup" aria-label="Wallpaper" hidden>
          <div class="wp-title">Wallpaper</div>
          <div class="wp-grid" id="wp-grid"></div>
          <div class="wp-note">Brain follows your 7-day score: brighter when you're thriving, duller when you're not</div>
        </div>
      </div>

    </div>
  </div>

  <script src="sites.js"></script>
  <script src="shared.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
