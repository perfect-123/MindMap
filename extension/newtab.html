<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { height: 100vh; overflow: hidden; }

    /* ── Today's photo, blurred into an aura ─────────────
       A small (400px) image is enough: once blurred it looks the same as a
       full-size one. Painted once per tab, no animation. */
    #bg {
      position: fixed;
      inset: -8%;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(48px) saturate(1.25);
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #bg.loaded { opacity: 0.9; }
    .shade {                       /* keeps text readable on bright photos */
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(7, 11, 20, 0.15) 0%, rgba(7, 11, 20, 0.35) 55%, rgba(7, 11, 20, 0.85) 100%);
    }
    .grain { z-index: 2; }

    #content {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 36px 44px;
    }

    /* ── Clock + greeting ───────────────────────────── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      text-align: center;
    }
    #clock {
      display: flex;
      align-items: flex-start;
      gap: 0.12em;
      font-size: clamp(4.5rem, 12vw, 8.5rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    #ampm {
      font-size: 0.16em;
      letter-spacing: var(--tracking);
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.4em;
    }
    #greeting {
      font-size: 13px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
    }

    /* ── Bottom row ─────────────────────────────────── */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    /* Brain score as a small album-cover tile */
    #brain-widget {
      display: flex;
      flex-direction: column;
      width: 228px;
      aspect-ratio: 1 / 1;
      padding: 22px 22px 20px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.25s ease;
    }
    #brain-widget.loaded { opacity: 1; }
    #brain-widget:hover { transform: translateY(-3px); }
    .tile-title {
      font-size: 11px;
      line-height: 2;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }
    #score-num {
      margin-top: auto;
      font-size: 64px;
      font-weight: 300;
      line-height: 1;
    }
    #score-num small { font-size: 0.4em; opacity: 0.8; }
    #state-name {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }
    .tile-foot {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    #photo-credit {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      text-align: right;
    }
    #photo-credit a { color: rgba(255, 255, 255, 0.75); text-decoration: none; }
    #photo-credit a:hover { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <div class="aura"></div>
  <div id="bg"></div>
  <div class="shade"></div>
  <div class="grain"></div>

  <div id="content">
    <div class="center">
      <div id="clock" class="ghost"><span id="time-digits">--:--</span><span id="ampm"></span></div>
      <div id="greeting"></div>
    </div>

    <div class="bottom">
      <a id="brain-widget" class="cover" title="Open dashboard">
        <div class="grain-layer"></div>
        <div class="tile-title">Brain health<br>last 7 days</div>
        <div id="score-num">--</div>
        <div id="state-name">Loading</div>
        <div class="tile-foot" id="state-sub"></div>
      </a>

      <div id="photo-credit"></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
