<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { height: 100vh; overflow: hidden; }

    /* ── Fixed background ────────────────────────────
       aura.png is a 44×54px, pre-blurred colour field (2.9 KB, bundled).
       The CSS blur smooths it when stretched to full screen. Static: no
       network, no animation, identical every day. */
    #bg {
      position: fixed;
      inset: -8%;
      z-index: 0;
      background: url(aura.png) center / cover no-repeat;
      filter: blur(20px) saturate(1.3);
      opacity: 0.9;
    }
    .shade {                       /* keeps the bottom tile readable */
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(7, 11, 20, 0.15) 0%, rgba(7, 11, 20, 0.35) 55%, rgba(7, 11, 20, 0.85) 100%);
    }
    .grain { z-index: 2; }

    #content {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 36px 44px;
    }

    /* ── Clock + greeting ───────────────────────────── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      text-align: center;
    }
    #clock {
      display: flex;
      align-items: flex-start;
      gap: 0.12em;
      font-size: clamp(4.5rem, 12vw, 8.5rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    #ampm {
      font-size: 0.16em;
      letter-spacing: var(--tracking);
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.4em;
    }
    #greeting {
      font-size: 13px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      cursor: text;
      min-height: 1.6em;
    }
    .name-input {
      width: 18ch;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      padding-bottom: 4px;
    }
    .name-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    /* ── Search ─────────────────────────────────────── */
    #search { width: min(560px, 82vw); margin-top: 14px; }
    #q {
      width: 100%;
      height: 50px;
      padding: 0 26px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(10, 14, 24, 0.28);
      color: #fff;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.06em;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    #q::placeholder {
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      font-size: 11px;
    }
    #q:hover { border-color: rgba(255, 255, 255, 0.28); }
    #q:focus { border-color: rgba(255, 255, 255, 0.55); background: rgba(10, 14, 24, 0.4); }
    #q::-webkit-search-cancel-button { filter: invert(1); opacity: 0.5; }

    /* ── Bottom row ─────────────────────────────────── */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    /* Brain score as a small album-cover tile */
    #brain-widget {
      display: flex;
      flex-direction: column;
      width: 228px;
      aspect-ratio: 1 / 1;
      padding: 22px 22px 20px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.25s ease;
    }
    #brain-widget.loaded { opacity: 1; }
    #brain-widget:hover { transform: translateY(-3px); }
    .tile-title {
      font-size: 11px;
      line-height: 2;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }
    #score-num {
      margin-top: auto;
      font-size: 64px;
      font-weight: 300;
      line-height: 1;
    }
    #score-num small { font-size: 0.4em; opacity: 0.8; }
    #state-name {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }
    .tile-foot {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

  </style>
</head>
<body>
  <div class="aura"></div>
  <div id="bg"></div>
  <div class="shade"></div>
  <div class="grain"></div>

  <div id="content">
    <div class="center">
      <div id="clock" class="ghost"><span id="time-digits">--:--</span><span id="ampm"></span></div>
      <div id="greeting"></div>
      <form id="search" role="search">
        <input id="q" type="search" name="q" placeholder="Search the web" autocomplete="off" aria-label="Search the web" />
      </form>
    </div>

    <div class="bottom">
      <a id="brain-widget" class="cover" title="Open dashboard">
        <div class="grain-layer"></div>
        <div class="tile-title">Brain health<br>last 7 days</div>
        <div id="score-num">--</div>
        <div id="state-name">Loading</div>
        <div class="tile-foot" id="state-sub"></div>
      </a>

    </div>
  </div>

  <script src="shared.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
