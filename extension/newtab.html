<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { height: 100vh; overflow: hidden; }

    /* ── Background: one scene ─────────────────────────
       backgrounds/<scene>.webp, 2000×1125, 20–40 KB each, bundled.
       newtab.js sets body[data-bg] before first paint, by time of day or the
       user's pick. Static: no network, no animation, no CSS filter. */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url(backgrounds/green.webp) center / cover no-repeat;
    }
    body[data-bg="blossom"]   #bg { background-image: url(backgrounds/blossom.webp); }
    body[data-bg="autumn"]    #bg { background-image: url(backgrounds/autumn.webp); }
    body[data-bg="fireflies"] #bg { background-image: url(backgrounds/fireflies.webp); }
    body[data-bg="snow"]      #bg { background-image: url(backgrounds/snow.webp); }
    .shade {                       /* keeps the bottom tile readable */
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(7, 11, 20, 0.15) 0%, rgba(7, 11, 20, 0.35) 55%, rgba(7, 11, 20, 0.85) 100%);
    }
    .grain { z-index: 2; }

    #content {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 36px 44px;
    }

    /* ── Clock + greeting ───────────────────────────── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      text-align: center;
    }
    #clock {
      display: flex;
      align-items: flex-start;
      gap: 0.12em;
      font-size: clamp(4.5rem, 12vw, 8.5rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    #ampm {
      font-size: 0.16em;
      letter-spacing: var(--tracking);
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.4em;
    }
    /* The clock's ghost follows the scene's motion (overrides theme.css .ghost) */
    body[data-bg="blossom"] #clock.ghost {        /* petals drifting diagonally */
      text-shadow:
        -0.08em -0.05em 0.04em rgba(255, 214, 232, 0.40),
        -0.18em -0.11em 0.08em rgba(255, 200, 225, 0.25),
        -0.30em -0.19em 0.14em rgba(255, 190, 220, 0.12);
    }
    body[data-bg="fireflies"] #clock.ghost {      /* glow with a curving trail */
      text-shadow:
         0      0      0.08em rgba(255, 240, 170, 0.45),
         0      0      0.30em rgba(255, 190, 120, 0.22),
        -0.10em 0.04em 0.03em rgba(255, 236, 160, 0.22),
        -0.20em 0.12em 0.05em rgba(255, 236, 160, 0.13),
        -0.28em 0.24em 0.07em rgba(255, 236, 160, 0.06);
    }
    body[data-bg="green"] #clock.ghost {          /* falling, blurred downward */
      text-shadow:
        0 -0.08em 0.04em rgba(222, 255, 226, 0.24),
        0 -0.18em 0.08em rgba(222, 255, 226, 0.13),
        0 -0.30em 0.14em rgba(222, 255, 226, 0.06);
    }
    body[data-bg="autumn"] #clock.ghost {         /* streaked sideways by wind */
      text-shadow:
        -0.12em 0 0.03em rgba(255, 214, 120, 0.28),
        -0.26em 0 0.06em rgba(255, 160, 80, 0.16),
        -0.44em 0 0.10em rgba(230, 90, 50, 0.08);
    }
    body[data-bg="snow"] #clock.ghost {           /* soft near-flake halo, aurora glow */
      text-shadow:
        0  0      0.10em rgba(225, 240, 255, 0.45),
        0  0      0.40em rgba(110, 220, 205, 0.28),
        0 -0.10em 0.06em rgba(225, 240, 255, 0.12);
    }

    #greeting {
      font-size: 13px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      cursor: text;
      min-height: 1.6em;
    }
    .name-input {
      width: 18ch;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      padding-bottom: 4px;
    }
    .name-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    /* ── Favorites: letter tiles ───────────────────── */
    #fav-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: min(800px, 90vw);
      margin-top: 14px;
    }
    .fav { position: relative; }
    .fav-link, .fav-add {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 84px;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      outline: none;
    }
    .fav-tile {
      position: relative;
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(10, 14, 24, 0.28);
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }
    .fav-link:hover .fav-tile, .fav-add:hover .fav-tile { border-color: rgba(255, 255, 255, 0.36); background: rgba(10, 14, 24, 0.42); transform: translateY(-2px); }
    .fav-link:focus-visible .fav-tile, .fav-add:focus-visible .fav-tile { border-color: rgba(255, 255, 255, 0.7); }
    /* A site's tile: border faintly tinted with its category colour (--cat) */
    .fav-link .fav-tile { border-color: color-mix(in srgb, var(--cat, #fff) 45%, transparent); }
    .fav-link:hover .fav-tile { border-color: color-mix(in srgb, var(--cat, #fff) 80%, transparent); }
    .fav-letter { font-size: 24px; font-weight: 300; line-height: 1; }
    .fav-add .fav-letter { color: rgba(255, 255, 255, 0.6); }
    .fav-name {
      max-width: 84px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
    }
    /* Edit / remove: shown on hover or keyboard focus */
    .fav-btn {
      position: absolute;
      top: -8px;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(10, 14, 24, 0.88);
      color: #fff;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .fav-edit { left: 2px; }
    .fav-remove { right: 2px; }
    .fav:hover .fav-btn, .fav:focus-within .fav-btn { opacity: 1; }
    .fav-btn:focus-visible { outline: none; border-color: rgba(255, 255, 255, 0.8); }

    /* Add / edit dialog */
    #fav-dialog {
      margin: auto;
      width: min(360px, 90vw);
      padding: 26px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(13, 20, 36, 0.94);
      color: var(--ink);
    }
    #fav-dialog::backdrop { background: rgba(4, 7, 14, 0.55); }
    #fav-form { display: flex; flex-direction: column; gap: 16px; }
    #fav-title { font-size: 11px; font-weight: 400; letter-spacing: var(--tracking); text-transform: uppercase; }
    #fav-form label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    #fav-form input {
      height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: none;
      outline: none;
    }
    #fav-form input:focus { border-color: rgba(255, 255, 255, 0.55); }
    #fav-form input::placeholder { color: rgba(255, 255, 255, 0.35); }
    #fav-error { min-height: 1em; font-size: 11px; color: #ffb4a8; }
    #fav-error:empty { display: none; }
    .fav-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .fav-actions button {
      min-height: 40px;
      padding: 0 18px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: none;
      color: rgba(255, 255, 255, 0.85);
      font: inherit;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .fav-actions button:hover { border-color: rgba(255, 255, 255, 0.36); }
    .fav-actions button:focus-visible { outline: none; border-color: rgba(255, 255, 255, 0.8); }
    .fav-actions .primary { background: rgba(255, 255, 255, 0.88); border-color: transparent; color: #0b1020; }
    .fav-actions .primary:hover { background: #fff; }

    /* ── Bottom row ─────────────────────────────────── */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    /* Brain score as a small album-cover tile */
    #brain-widget {
      display: flex;
      flex-direction: column;
      width: 228px;
      aspect-ratio: 1 / 1;
      padding: 22px 22px 20px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.25s ease;
    }
    #brain-widget.loaded { opacity: 1; }
    #brain-widget:hover { transform: translateY(-3px); }
    .tile-title {
      font-size: 11px;
      line-height: 2;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }
    #score-num {
      margin-top: auto;
      font-size: 64px;
      font-weight: 300;
      line-height: 1;
    }
    #score-num small { font-size: 0.4em; opacity: 0.8; }
    #state-name {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }
    .tile-foot {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    /* Tile with the background controls underneath */
    .tile-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 228px;
    }
    .bg-controls { display: flex; gap: 8px; }
    .bg-controls button {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(10, 14, 24, 0.28);
      color: rgba(255, 255, 255, 0.88);
      font: inherit;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .bg-controls button:hover { border-color: rgba(255, 255, 255, 0.32); background: rgba(10, 14, 24, 0.4); }
    .bg-controls button:focus-visible { outline: none; border-color: rgba(255, 255, 255, 0.6); }

    /* Scene: shows the current scene, click for the next one (turns Auto off) */
    #bg-picker { flex: 1; min-width: 0; justify-content: space-between; }
    #bg-picker .bg-k { font-size: 14px; letter-spacing: 0; color: rgba(255, 255, 255, 0.55); }
    #bg-auto { flex: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Auto: on/off switch — on, the scene follows the time of day */
    .switch {
      position: relative;
      width: 24px;
      height: 14px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: background 0.2s ease;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    #bg-auto[aria-checked="true"] .switch { background: rgba(255, 255, 255, 0.85); border-color: transparent; }
    #bg-auto[aria-checked="true"] .switch::after { transform: translateX(10px); background: #0b1020; }

  </style>
</head>
<body>
  <div class="aura"></div>
  <div id="bg"></div>
  <div class="shade"></div>
  <div class="grain"></div>

  <div id="content">
    <div class="center">
      <div id="clock" class="ghost"><span id="time-digits">--:--</span><span id="ampm"></span></div>
      <div id="greeting"></div>
      <nav aria-label="Favorites">
        <ul id="fav-list"></ul>
      </nav>
    </div>

    <div class="bottom">
      <div class="tile-stack">
      <a id="brain-widget" class="cover" title="Open dashboard">
        <div class="grain-layer"></div>
        <div class="tile-title">Brain health<br>last 7 days</div>
        <div id="score-num">--</div>
        <div id="state-name">Loading</div>
        <div class="tile-foot" id="state-sub"></div>
      </a>

        <div class="bg-controls">
          <button id="bg-picker" type="button" title="Next background">
            <span><span class="sr-only">Scene: </span><span id="bg-name"></span></span><span class="bg-k" aria-hidden="true">›</span>
          </button>
          <button id="bg-auto" type="button" role="switch" aria-checked="true" title="Change the scene with the time of day">
            <span>Auto</span><span class="switch" aria-hidden="true"></span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <dialog id="fav-dialog" aria-labelledby="fav-title">
    <form id="fav-form" method="dialog">
      <h2 id="fav-title">Add a favorite</h2>
      <label>Address <input id="fav-url" type="text" inputmode="url" autocomplete="off" placeholder="github.com" required /></label>
      <label>Name <input id="fav-name" type="text" autocomplete="off" maxlength="24" placeholder="Optional" /></label>
      <p id="fav-error" role="alert"></p>
      <div class="fav-actions">
        <button type="submit" value="cancel" formnovalidate>Cancel</button>
        <button type="submit" value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <template id="fav-template">
    <li class="fav">
      <a class="fav-link">
        <span class="fav-tile"><span class="fav-letter" aria-hidden="true"></span></span>
        <span class="fav-name"></span>
      </a>
      <button type="button" class="fav-btn fav-edit">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
      </button>
      <button type="button" class="fav-btn fav-remove">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </li>
  </template>

  <template id="fav-add-template">
    <li class="fav">
      <button type="button" class="fav-add">
        <span class="fav-tile"><span class="fav-letter" aria-hidden="true">+</span></span>
        <span class="fav-name">Add</span>
      </button>
    </li>
  </template>

  <script src="sites.js"></script>
  <script src="shared.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
