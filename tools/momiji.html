<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#000}
#root{width:1920px;height:1200px;position:relative;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden}
.leaf{position:absolute}
.leaf svg{width:100%;height:100%;display:block}
</style></head><body><div id="root"></div>
<script>
const STATES = {
  thriving: {
    base: '#06121a',
    field: 'radial-gradient(ellipse 30% 26% at 50% 33%, #79b9b2 0%, rgba(121,185,178,0) 72%), radial-gradient(ellipse 46% 52% at 30% 40%, #3e9786 0%, rgba(62,151,134,0) 72%), radial-gradient(ellipse 46% 52% at 71% 38%, #4c98ba 0%, rgba(76,152,186,0) 72%), linear-gradient(180deg, #2b6a74 0%, #163f4a 48%, #071820 100%)',
    dusk: 'linear-gradient(180deg, rgba(5,14,22,0) 0%, rgba(5,14,22,0) 50%, rgba(5,14,22,0.72) 76%, #040c12 100%)',
    tones: ['#6f9f68', '#5f8f62', '#8fb383', '#a3bd8c'], vein: 'rgba(232,255,226,0.28)', dim: 1, amount: 24, trail: 4, sway: 14, seed: 4
  },
  healthy: {
    base: '#0a0f1c',
    field: 'radial-gradient(ellipse 28% 24% at 51% 33%, #b8876a 0%, rgba(184,135,106,0) 72%), radial-gradient(ellipse 46% 52% at 29% 40%, #5f86ad 0%, rgba(95,134,173,0) 72%), radial-gradient(ellipse 46% 52% at 72% 39%, #a85c3a 0%, rgba(168,92,58,0) 72%), linear-gradient(180deg, #3a4866 0%, #1c2438 48%, #0a0f1c 100%)',
    dusk: 'linear-gradient(180deg, rgba(8,12,24,0) 0%, rgba(8,12,24,0) 50%, rgba(8,12,24,0.74) 76%, #070b16 100%)',
    tones: ['#a5442f', '#b8643a', '#c08a4a', '#8e3a34'], vein: 'rgba(255,214,186,0.3)', dim: 1, amount: 18, trail: 4, sway: 14, seed: 9
  },
  sluggish: {
    base: '#0f0b08',
    field: 'radial-gradient(ellipse 26% 22% at 50% 34%, #8e7046 0%, rgba(142,112,70,0) 72%), radial-gradient(ellipse 46% 52% at 30% 41%, #5f5238 0%, rgba(95,82,56,0) 72%), radial-gradient(ellipse 46% 52% at 71% 40%, #7e4a2e 0%, rgba(126,74,46,0) 72%), linear-gradient(180deg, #3d3326 0%, #221b14 48%, #0f0b08 100%)',
    dusk: 'linear-gradient(180deg, rgba(14,10,7,0) 0%, rgba(14,10,7,0) 48%, rgba(14,10,7,0.76) 75%, #0b0806 100%)',
    tones: ['#8a5a36', '#7a5232', '#9a7444', '#6b4430'], vein: 'rgba(240,210,170,0.22)', dim: 0.88, amount: 14, trail: 3, sway: 10, seed: 21
  },
  rotting: {
    base: '#0a0b0c',
    field: 'radial-gradient(ellipse 24% 20% at 50% 34%, #55585c 0%, rgba(85,88,92,0) 72%), radial-gradient(ellipse 46% 52% at 30% 41%, #3a3f47 0%, rgba(58,63,71,0) 72%), radial-gradient(ellipse 46% 52% at 71% 40%, #46423e 0%, rgba(70,66,62,0) 72%), linear-gradient(180deg, #2a2c30 0%, #18191c 48%, #0a0b0c 100%)',
    dusk: 'linear-gradient(180deg, rgba(9,10,11,0) 0%, rgba(9,10,11,0) 46%, rgba(9,10,11,0.78) 74%, #08090a 100%)',
    tones: ['#5e5a55', '#4d4a47', '#66625c', '#45423f'], vein: 'rgba(210,206,200,0.16)', dim: 0.72, amount: 9, trail: 2, sway: 6, seed: 2
  }
};

// Draws one momiji scene per brain state; tools/render-momiji.js screenshots it.
// Seeds and counts match the "Momiji through the seasons" design boards.
function build(c) {
  const { tones, vein, dim, amount, trail, sway } = c;
  let s = c.seed >>> 0;
  const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const lengths = [0.42, 0.72, 0.93, 1, 0.93, 0.72, 0.42];
  const span = 35 * Math.PI / 180;
  const sinus = [0.24 * Math.cos(span / 2), 0.24 * Math.sin(span / 2)];
  const outer = [0.06, 0.04];
  const edge = (theta, L, start, side) => {
    const dx = Math.cos(theta), dy = Math.sin(theta), px = -Math.sin(theta), py = Math.cos(theta);
    const pts = [];
    for (let k = 0; k <= 16; k++) {
      const t = k / 16;
      let x = start[0] + (L - start[0]) * t;
      let w = start[1] * (1 - t) * (1 - t) + 0.14 * L * Math.sin(Math.PI * Math.pow(t, 0.85));
      if (k % 2 === 1 && k < 16) { w += 0.022 * L * (1 - 0.5 * t); x += 0.012 * L; }
      pts.push((dx * x + px * w * side).toFixed(4) + ' ' + (dy * x + py * w * side).toFixed(4));
    }
    return pts;
  };
  let outline = [], veins = '';
  lengths.forEach((L, i) => {
    const theta = -Math.PI / 2 + (i - 3) * span;
    outline = outline.concat(edge(theta, L, i === 0 ? outer : sinus, -1));
    outline = outline.concat(edge(theta, L, i === 6 ? outer : sinus, 1).reverse());
    veins += 'M 0 0 L ' + (Math.cos(theta) * L * 0.9).toFixed(4) + ' ' + (Math.sin(theta) * L * 0.9).toFixed(4) + ' ';
  });
  const d = 'M ' + outline.join(' L ') + ' Z';
  const leaf = (cx, cy, size, rot, blur, op, fill) => ({ cx, cy, size, rot, blur, op, d, veins, fill, vein });
  const drift = (list, cx, cy, size, rot, blur, op, fill, n) => {
    const step = size / 320;
    for (let k = n; k >= 1; k--) {
      list.push(leaf(cx + (82 * k + 5 * k * k) * step, cy + (-64 * k + 4 * k * k) * step, size, rot + sway * k, blur + (3 + 5 * Math.pow(k, 1.3)) * step, op * 0.32 * Math.pow(0.6, k - 1), fill));
    }
    list.push(leaf(cx, cy, size, rot, blur, op, fill));
  };
  // keep the clock, greeting and favorites row clear
  const clear = (cx, cy, r) => !(cx + r > 440 && cx - r < 1480 && cy + r > 120 && cy - r < 760);
  const back = [];
  for (let i = 0, tries = 0; i < amount && tries < 500; tries++) {
    const r = rand();
    const size = r < 0.55 ? 36 + rand() * 60 : r < 0.9 ? 110 + rand() * 110 : 420 + rand() * 300;
    const cx = rand() * 2000 - 40;
    const cy = rand() * 1260 - 60;
    const near = size > 400;
    if (near ? (cy < 700 && cx > 400 && cx < 1500) : !clear(cx, cy, size * 0.4)) continue;
    const fill = tones[Math.floor(rand() * tones.length)];
    const rot = rand() * 360;
    if (near) back.push(leaf(cx, cy, size, rot, 26 + rand() * 14, 0.22 * dim, fill));
    else if (size < 100) back.push(leaf(cx, cy, size, rot, 1.5 + rand() * 3, (0.35 + rand() * 0.25) * dim, fill));
    else drift(back, cx, cy, size, rot, 0.6 + rand(), (0.6 + rand() * 0.25) * dim, fill, Math.min(trail, 2));
    i++;
  }
  const front = [];
  drift(front, 1520, 860, 300, -28, 0.3, 0.94 * dim, tones[0], trail);
  return { back, front };
}

function layer(leaves) {
  const el = document.createElement('div');
  el.className = 'layer';
  el.innerHTML = leaves.map((p) => `<div class="leaf" style="left:${(p.cx - p.size / 2).toFixed(1)}px;top:${(p.cy - p.size / 2).toFixed(1)}px;width:${p.size.toFixed(1)}px;height:${p.size.toFixed(1)}px;transform:rotate(${p.rot.toFixed(1)}deg);filter:blur(${p.blur.toFixed(1)}px);opacity:${p.op.toFixed(3)}"><svg viewBox="-1.05 -1.05 2.1 2.1"><path d="${p.d}" fill="${p.fill}"/><path d="${p.veins}" fill="none" stroke="${p.vein}" stroke-width="0.012" stroke-linecap="round"/><path d="M 0 0.02 Q 0.03 0.2 0.07 0.42" fill="none" stroke="${p.fill}" stroke-width="0.022" stroke-linecap="round"/></svg></div>`).join('');
  return el;
}

const c = STATES[new URLSearchParams(location.search).get('state')];
const root = document.getElementById('root');
root.style.background = c.base;
const field = document.createElement('div');
field.style.cssText = `position:absolute;inset:-200px;filter:blur(90px);background:${c.field}`;
const dusk = document.createElement('div');
dusk.style.cssText = `position:absolute;inset:0;background:${c.dusk}`;
const { back, front } = build(c);
root.append(field, layer(back), dusk, layer(front));
</script></body></html>
